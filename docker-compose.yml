services:
  keycloak-db:
    image: postgres:13-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db

  identity-service-db:
    image: postgres:16-alpine
    container_name: identity-db
    environment:
      POSTGRES_DB: FcgIdentity
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - identity_db_data:/var/lib/postgresql/data
  
  # identity-api:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: identity-api
  #   ports:
  #     - "5002:80"
  #   depends_on:
  #     - keycloak
  #     - identity-service-db
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development
  #     - ConnectionStrings__DefaultConnection=Host=identity-service-db;Database=FcgIdentity;Username=user;Password=password
  #     - Jwt__Authority=http://keycloak:8080/realms/fiap-cloud-games
  #     - KeycloakAdmin__BaseUrl=http://keycloak:8080

volumes:
  keycloak_db_data:
  identity_db_data:
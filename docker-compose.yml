networks:
  default:
    driver: bridge
  kong-net:
    driver: bridge

services:
  keycloak-db:
    image: postgres:13-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - default

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Kong Database - PostgreSQL mais recente para melhor performance
  kong-db:
    image: postgres:16-alpine
    container_name: kong-db
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong123
    ports:
      - "5435:5432"
    volumes:
      - kong_db_data:/var/lib/postgresql/data
    networks:
      - kong-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Konga Database - PostgreSQL 11.16 específico para compatibilidade com Konga
  konga-db:
    image: postgres:11.16-alpine
    container_name: konga-db
    environment:
      POSTGRES_DB: konga
      POSTGRES_USER: konga
      POSTGRES_PASSWORD: konga123
    ports:
      - "5436:5432"
    volumes:
      - konga_db_data:/var/lib/postgresql/data
    networks:
      - kong-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konga -d konga"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kong Migrations
  kong-migrations:
    image: kong:latest
    container_name: kong-migrations
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong123
    networks:
      - kong-net
    depends_on:
      kong-db:
        condition: service_healthy
    restart: "no"

  # Kong Gateway
  kong:
    image: kong:latest
    container_name: kong-gateway
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong123
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      KONG_ADMIN_GUI_URL: http://localhost:8002
    ports:
      - "8000:8000"     # Kong Proxy
      - "8443:8443"     # Kong Proxy SSL
      - "8001:8001"     # Kong Admin API
      - "8444:8444"     # Kong Admin API SSL
      - "8002:8002"     # Kong Manager
      - "8445:8445"     # Kong Manager SSL
    networks:
      - kong-net
      - default
    depends_on:
      - kong-migrations
    restart: always

  # Konga Preparation
  konga-prepare:
    image: pantsel/konga:latest
    container_name: konga-prepare
    command: "-c prepare -a postgres -u postgresql://konga:konga123@konga-db:5432/konga"
    networks:
      - kong-net
    depends_on:
      konga-db:
        condition: service_healthy
    restart: "no"

  # Konga Admin GUI
  konga:
    image: pantsel/konga:latest
    container_name: konga-gui
    environment:
      TOKEN_SECRET: konga-secret-token
      DB_ADAPTER: postgres
      DB_HOST: konga-db
      DB_PORT: 5432
      DB_DATABASE: konga
      DB_USER: konga
      DB_PASSWORD: konga123
      NODE_ENV: production
    ports:
      - "1337:1337"
    networks:
      - kong-net
      - default
    depends_on:
      - konga-prepare
    restart: always

  # 🚀 SEU IDENTITY SERVICE (ATIVADO)
  identity-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: identity-api
    ports:
      - "5001:80"  # ✅ Corrigido para 5001
    depends_on:
      keycloak:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - Jwt__Authority=http://keycloak:8080/realms/fiap-cloud-games
      - Jwt__Audience=fcg-api
      - KeycloakConfiguration__BaseUrl=http://keycloak:8080
      - KeycloakConfiguration__TokenEndpointPath=/realms/master/protocol/openid-connect/token
      - KeycloakConfiguration__UsersEndpointPath=/admin/realms/fiap-cloud-games/users
      - KeycloakConfiguration__TargetRealm=fiap-cloud-games
      - KeycloakConfiguration__Audience=http://keycloak:8080
      - KeycloakConfiguration__AdminClientId=fcg-api-service-account
      - KeycloakConfiguration__AdminClientSecret=PQ9djJiucWU1VLkzjm2O84nSu5bKnVje
      - KeycloakConfiguration__ApiClientId=fcg-api
      - KeycloakConfiguration__ApiClientSecret=2HUm0LauNhHn5Swn7yS0brWmamRohCYK
    networks:
      - default
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  keycloak_db_data:
  kong_db_data:
  konga_db_data:
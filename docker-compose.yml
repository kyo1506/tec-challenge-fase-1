networks:
  default:
    driver: bridge

services:
  # 🗄️ Keycloak Database
  keycloak-db:
    image: postgres:13-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 🔐 Keycloak (Identity Provider)
  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    container_name: keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
    ports:
      - "8080:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 🚀 Identity API (Aplicação Principal)
  identity-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: identity-api
    ports:
      - "5001:80"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      # ASP.NET Core
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80

      # JWT Configuration
      - Jwt__Authority=http://keycloak:8080/realms/fiap-cloud-games
      - Jwt__Audience=fcg-api

      # Keycloak Integration
      - KeycloakConfiguration__BaseUrl=http://keycloak:8080
      - KeycloakConfiguration__TokenEndpointPath=/realms/master/protocol/openid-connect/token
      - KeycloakConfiguration__UsersEndpointPath=/admin/realms/fiap-cloud-games/users
      - KeycloakConfiguration__TargetRealm=fiap-cloud-games
      - KeycloakConfiguration__Audience=http://keycloak:8080
      - KeycloakConfiguration__AdminClientId=fcg-api-service-account
      - KeycloakConfiguration__AdminClientSecret=PQ9djJiucWU1VLkzjm2O84nSu5bKnVje
      - KeycloakConfiguration__ApiClientId=fcg-api
      - KeycloakConfiguration__ApiClientSecret=2HUm0LauNhHn5Swn7yS0brWmamRohCYK
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  keycloak_db_data:
    driver: local

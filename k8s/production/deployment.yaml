---
# Identity API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api
  namespace: identity-system
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: identity-api
  template:
    metadata:
      labels:
        app: identity-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: identity-api
        image: 208452488125.dkr.ecr.sa-east-1.amazonaws.com/fcg-identity-api:latest
        imagePullPolicy: Always  # Always pull the latest image from ECR
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: identity-api-config
        env:
        - name: KeycloakConfiguration__AdminClientSecret
          valueFrom:
            secretKeyRef:
              name: keycloak-client-secrets
              key: admin-client-secret
        - name: KeycloakConfiguration__ApiClientSecret
          valueFrom:
            secretKeyRef:
              name: keycloak-client-secrets
              key: api-client-secret
        # JWT Configuration
        - name: Jwt__Issuer
          valueFrom:
            secretKeyRef:
              name: jwt-secrets
              key: issuer
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
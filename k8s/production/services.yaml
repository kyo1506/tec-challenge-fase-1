---
# Identity API Service
apiVersion: v1
kind: Service
metadata:
  name: identity-api-service
  namespace: identity-system
spec:
  selector:
    app: identity-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

---
# Keycloak Service
apiVersion: v1
kind: Service
metadata:
  name: keycloak-service
  namespace: identity-system
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP

---
# Keycloak Database Service  
apiVersion: v1
kind: Service
metadata:
  name: keycloak-db-service
  namespace: identity-system
spec:
  selector:
    app: keycloak-db
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP


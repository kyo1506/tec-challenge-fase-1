# Identity System Migration to Kong Ingress Controller
# Migrando: Keycloak + Identity API + Kong Admin (opcional)

---
# Keycloak Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-ingress
  namespace: identity-system
  annotations:
    # Kong strip-path: false - mantém o path original para Keycloak
    konghq.com/strip-path: "false"
    # Kong plugins para Keycloak
    konghq.com/plugins: keycloak-cors
spec:
  ingressClassName: kong
  rules:
    - host: keycloak.fcg-identity.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak-service
                port:
                  number: 8080

---
# Identity API Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: identity-api-ingress
  namespace: identity-system
  annotations:
    # Kong strip-path: true - remove o prefixo /identity antes de enviar para a API
    konghq.com/strip-path: "true"
    # Kong plugins para Identity API
    konghq.com/plugins: identity-cors, identity-rate-limiting, identity-correlation-id
spec:
  ingressClassName: kong
  rules:
    - host: api.fcg-identity.com
      http:
        paths:
          - path: /identity
            pathType: Prefix
            backend:
              service:
                name: identity-api-service
                port:
                  number: 80

# Kong Plugins para Identity System
---
# CORS para Keycloak
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: keycloak-cors
  namespace: identity-system
plugin: cors
config:
  origins:
    - "*"
  methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  headers:
    - Accept
    - Accept-Version
    - Content-Length
    - Content-MD5
    - Content-Type
    - Date
    - Authorization
    - X-Correlation-ID
  exposed_headers:
    - X-Correlation-ID
  credentials: true
  max_age: 3600
  preflight_continue: false

---
# CORS para Identity API
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: identity-cors
  namespace: identity-system
plugin: cors
config:
  origins:
    - "*"
  methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
    - PATCH
  headers:
    - Accept
    - Accept-Version
    - Content-Length
    - Content-MD5
    - Content-Type
    - Date
    - Authorization
    - X-Auth-Token
    - X-Correlation-ID
  exposed_headers:
    - X-Auth-Token
    - X-Correlation-ID
  credentials: true
  max_age: 3600
  preflight_continue: false

---
# Rate Limiting para Identity API
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: identity-rate-limiting
  namespace: identity-system
plugin: rate-limiting
config:
  minute: 200
  hour: 2000
  policy: local
  fault_tolerant: true
  hide_client_headers: false

---
# Correlation ID para Identity API
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: identity-correlation-id
  namespace: identity-system
plugin: correlation-id
config:
  header_name: X-Correlation-ID
  generator: uuid#counter
  echo_downstream: true

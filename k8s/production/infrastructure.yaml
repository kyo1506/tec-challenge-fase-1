---
# Keycloak Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: identity-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:22.0
        command: ["/opt/keycloak/bin/kc.sh"]
        args: ["start-dev", 
               "--hostname-strict=false", 
               "--hostname-strict-https=false",
               "--http-enabled=true", 
               "--proxy=edge",
               "--hostname-url=http://keycloak-service:8080",
               "--hostname-admin-url=http://keycloak-service:8080"]
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: keycloak-config
        env:
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: keycloak-db-password
        - name: KC_DB_URL
          value: "jdbc:postgresql://keycloak-db-service:5432/keycloak"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 180
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 300
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5

